name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contract tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Agent E runs in Node inside the tests (presets/agent-e-cli.mjs).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Direct mode tests (the slow marker is excluded by pytest.ini)
        run: python -m pytest tests/ -q -p no:cacheprovider
      - name: genvm-lint (AST safety checks)
        run: |
          genvm-lint lint contracts/VerifierFactory.py
          genvm-lint lint contracts/VerificationInstance.py

  presets:
    name: Preset agent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: agent-core tests (fetch is mocked, no network, no key)
        run: node presets/test-agent-core.mjs

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and production build
        run: npm run build
