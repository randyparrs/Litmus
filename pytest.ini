[pytest]
# The default run uses 100 seeds per template. The 500-seed version of the same checks is marked
# "slow" (about 15 minutes):
#   py -3.12 -m pytest tests/ -q -p no:cacheprovider -m slow > tests-slow.txt 2>&1
markers =
    slow: the 500-seed version of the probe set checks
addopts = -m "not slow"
